<h2 data-i18n="Machinon Icon Pack">Machinon Icon Pack</h2>
<p class="iconpack-intro">Browse the icon pack shipped with this theme and install icons into the Domoticz database. Blue UI and Color are two styles of the same set and can be installed side by side; installed icons appear in every device's Switch Icon picker.</p>
<div id="iconpackTabs" class="iconpack-tabs" role="tablist">
    <button type="button" data-tab="blue" class="active" data-i18n="Blue UI">Blue UI</button>
    <button type="button" data-tab="color" data-i18n="Color">Color</button>
    <button type="button" data-tab="fun" data-i18n="Fun">Fun</button>
</div>
<div class="iconpack-toolbar">
    <input type="search" id="iconpackSearch" placeholder="Search icons..">
    <span id="iconpackCounter"></span>
    <button type="button" class="btn btn-info" id="iconpackInstallAll">Install / update all</button>
</div>
<div id="iconpackGrid" class="iconpack-grid">Loading..</div>
