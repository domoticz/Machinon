name: Validate

# CI gate: keeps master releasable at all times by running the same checks
# the release build runs, plus the comment-stripper unit tests.
#
# COPY-PASTE NOTES for other theme authors: nothing to change if you took
# scripts/build-release.sh (it embeds the guard scripts you kept). Drop the
# pytest step if you did not take scripts/strip_comments.py.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned dev tools
        run: pip install -r requirements-dev.txt

      - name: Comment-stripper unit tests
        run: python3 -m pytest scripts/test_strip_comments.py -q

      - name: Site and docs unit tests
        run: python3 -m pytest scripts/test_gen_site_tokens.py scripts/test_check_site.py scripts/test_check_contrast.py scripts/test_check_settings_docs.py scripts/test_check_png_optimized.py -q

      - name: Icon and status-glow contrast unit tests
        run: python3 -m pytest scripts/test_measure_icon_contrast.py -q

      - name: Node unit tests (scheme maths, contrast floors, i18n)
        run: node --test scripts/test-color-oklch.mjs scripts/test-color-repair.mjs scripts/test-scheme-generator.mjs scripts/test-scheme-pairs.mjs scripts/test-toast-policy.mjs scripts/test-i18n.mjs scripts/test-check-lang-parity.mjs

      - name: Icon and status-glow colours clear the contrast floor on every scheme
        run: python3 scripts/measure-icon-contrast.py --check

      - name: Site tokens are in step with the theme's schemes
        run: python3 scripts/gen-site-tokens.py --check

      - name: Landing page guards
        run: python3 scripts/check-site.py

      - name: Landing page contrast holds WCAG AA in every scheme
        run: python3 scripts/check-contrast.py

      - name: Settings reference covers the manifest
        run: python3 scripts/check-settings-docs.py

      # scripts/check-png-optimized.py itself runs in .github/workflows/
      # png-optimized.yml, not here: a full oxipng-level-6 scan over every
      # tracked PNG takes minutes and only ever changes when a PNG changes,
      # so it is gated on that instead of running on every push. Its unit
      # test above still runs on every push; only the slow full-tree scan
      # moved.

      - name: Manual builds clean
        run: zensical build --clean --strict

      - name: Published site makes no external requests
        run: |
          cp -r site/* build/
          # The theme's vendored JS bundle (assets/javascripts/bundle*.min.js
          # and its source map) contains the literal string
          # "https://api.github.com/repos/..." as dead code for the
          # repo-stats widget (star, fork and release counts): that code
          # ships in every Material build and is not conditionally compiled
          # out per project. overrides/partials/source.html already drops
          # the data-md-component="source" attribute that is the only thing
          # that makes Material's bundle call it, so the string here is
          # unreachable, not a live request. Excluding the vendor bundle
          # keeps this check meaningful instead of permanently red on a
          # string neither this repo nor its authors wrote.
          #
          # That exclusion is only safe because the two assertions below
          # hold. They are a pair with the exclusion above, not a redundant
          # extra: the exclusion trusts that data-md-component="source" is
          # gone from the built HTML, and nothing else in this step checks
          # that trust is still warranted. Do not remove either assertion
          # while the exclusion stays.
          if grep -rIlE 'https?://(fonts\.(googleapis|gstatic)\.com|api\.github\.com|cdn\.|unpkg\.com|cdnjs\.)' build/ --exclude='bundle*.min.js*' ; then
            echo "external asset host referenced in the built site" >&2
            exit 1
          fi
          echo "no external asset hosts in the built site"

          zensical_version=$(grep -oP 'zensical==\K.*' requirements-dev.txt)

          if grep -rq 'data-md-component="source"' build/docs/; then
            echo "overrides/partials/source.html is no longer suppressing data-md-component=\"source\"." >&2
            echo "That attribute is what makes the theme's bundle call api.github.com on every page view (see the comment above and in overrides/partials/source.html)." >&2
            echo "Likely cause: zensical was bumped past ${zensical_version} and restructured partials/source.html, renamed it, or moved the attribute to a different element, and the override no longer matches or no longer applies." >&2
            echo "Compare overrides/partials/source.html against the upstream partials/source.html shipped in the new zensical version and update the override to match, still without the data-md-component attribute." >&2
            exit 1
          fi
          echo "data-md-component=\"source\" is absent: the repo-stats fetch stays unreachable"

          if ! grep -q 'class="md-source"' build/docs/index.html; then
            echo "overrides/partials/source.html no longer renders the repository link at all (no class=\"md-source\" found in build/docs/index.html)." >&2
            echo "Check overrides/partials/source.html: it should still render the <a class=\"md-source\"> link, just without data-md-component=\"source\"." >&2
            exit 1
          fi
          echo "repository link still renders"

      - name: Import chain resolves
        run: scripts/build-dist.sh --check

      - name: Release build dry run (guards + stage + leak check)
        run: |
          scripts/build-release.sh
          test -f dist/machinon/custom.css
          test -f dist/machinon/theme.json
          test -f dist/machinon/NOTICE
          if find dist/machinon \( -name "*.sh" -o -name "*.py" -o -name "DESIGN.md" -o -name "CONTRIBUTING.md" -o -path "*.github*" \) | grep -q .; then
            echo "dev files leaked into the staging tree" >&2
            exit 1
          fi
