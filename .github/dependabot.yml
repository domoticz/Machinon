# Keeps the SHA-pinned GitHub Actions and the pinned dev tools in
# requirements-dev.txt fresh. The cooldown skips just-published versions
# (supply-chain protection).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
